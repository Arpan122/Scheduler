name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          script: |
            echo ${{ secrets.EC2_SSH_KEY }} > key.pem && chmod 400 "key.pem"
            ssh -i "key.pem" ${{ secrets.USERNAME }}@${{ secrets.HOST_DNS }}

            echo "Connected to EC2 Server"

            cd /home/ubuntu/Scheduler &&
            git pull origin main

            echo "Installing Dependencies"
            sudo npm ci

            echo "Building application"
            sudo npm run build

            echo "Restarting Bakcend Server"
            pm2 restart backend-server
            pm2 save

            echo "Restarting Frontend Server"
            sudo cp -r frontend/dist/* /var/www/html/
            sudo nginx -t &&
            sudo systemctl reload nginx