name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Build frontend and backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            frontend/dist
            backend/dist
            backend/package.json
            package.json
            package-lock.json

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: Load SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 via SSH
        env:
          HOSTNAME: ${{ secrets.HOST_DNS }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          # Create temporary archive of built dist & configs
          tar -czf release.tgz frontend/dist backend/dist package.json package-lock.json backend/package.json

          # Copy compressed release archive to EC2
          scp -o StrictHostKeyChecking=no release.tgz ${USERNAME}@${HOSTNAME}:/tmp/release.tgz

          # Extract and apply release on EC2
          ssh -o StrictHostKeyChecking=no ${USERNAME}@${HOSTNAME} '
            set -e

            echo "==> Deploying release bundle..."
            mkdir -p /home/ubuntu/Scheduler
            cd /home/ubuntu/Scheduler

            # Unpack release
            tar -xzf /tmp/release.tgz -C .
            rm -f /tmp/release.tgz

            # Install production dependencies for backend if needed
            npm install --production

            # Ensure PM2 is installed
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Restart backend Express server
            pm2 restart schedule-backend || pm2 start backend/dist/index.js --name "schedule-backend" --cwd /home/ubuntu/Scheduler/backend
            pm2 save

            # Sync static frontend to Nginx
            sudo mkdir -p /var/www/html
            sudo cp -r frontend/dist/* /var/www/html/

            # Reload Nginx
            sudo nginx -t
            sudo systemctl reload nginx

            echo "==> Fast deployment complete!"
          '