name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY}}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa


      - name: Build and Deploy with SSH
        env:
          HOSTNAME: ${{ secrets.HOST_DNS }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ~/.ssh/id_rsa ${USERNAME}@${HOSTNAME}

          cd /home/ubuntu/Scheduler
          git pull origin main

          echo "Installing Dependencies"
          sudo npm i

          echo "Building application"
          sudo npm run build

          echo "Restarting Backend Server"
          pm2 restart backend-server
          pm2 save

          echo "Restarting Frontend Server"
          sudo cp -r frontend/dist/* /var/www/html/
          sudo nginx -t &&
          sudo systemctl reload nginx